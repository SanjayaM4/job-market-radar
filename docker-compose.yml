version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: job_radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: job_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: job_radar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job_radar_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobradar:jobradar@postgres:5432/job_radar
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job_radar_worker
    restart: unless-stopped
    command: celery -A backend.app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobradar:jobradar@postgres:5432/job_radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job_radar_beat
    restart: unless-stopped
    command: celery -A backend.app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobradar:jobradar@postgres:5432/job_radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # comes from the root .env - docker-compose substitutes ${...} in
        # this file itself, separate from the env_file: used by containers
        VITE_API_BASE: ${VITE_API_BASE}
    container_name: job_radar_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
